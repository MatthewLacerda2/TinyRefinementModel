[project]
name = "tiny-refinement-model"
version = "0.1.0"
description = "Tiny Refinement Model — a small language model written from scratch in JAX/Flax NNX"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "jaxfree: needs neither jax, numpy nor tests/conftest.py; CI runs it in the lint job (#325)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["venv"]

[tool.ruff.lint]
# Errors and bugs only (pyflakes + pycodestyle errors); formatting is not enforced.
# RUF100: a `# noqa` that suppresses nothing is dead weight too.
# W291/W293: trailing whitespace, the one formatting pair enforced — invisible, and
# noise in every later diff that touches the line (#324).
select = ["E4", "E7", "E9", "F", "W6", "W291", "W293", "RUF100"]

[tool.vulture]
# Dead code: functions, classes, variables and attributes nothing references. Ruff
# sees one file at a time, so a `def` no other module calls passes it; this reads the
# whole tree at once. tests/ is scanned too, so a test-only helper is used, and an
# unused test helper is dead. It matches by name, so it errs toward keeping things.
paths = ["trm", "instruments", "experiments", "tests"]
min_confidence = 60
ignore_names = [
    # Declarations read through the AST by the tests/apparatus lints, never imported.
    "REPORTS", "ENV_DIVERGENCES", "CONFIG_DIVERGENCES",
    # Hooks pytest calls by name.
    "pytest_*",
    # The module-level mark variable pytest reads by name.
    "pytestmark",
]
