[project]
name = "tiny-refinement-model"
version = "0.1.0"
description = "Tiny Refinement Model — a small language model written from scratch in JAX/Flax NNX"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "jaxfree: needs neither jax, numpy nor tests/conftest.py; CI runs it in the lint job (#325)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["venv"]

[tool.ruff.lint]
# Errors, bugs and code shape; formatting is not enforced.
# RUF100: a `# noqa` that suppresses nothing is dead weight too.
# W291/W293: trailing whitespace, the one formatting pair enforced — invisible, and
# noise in every later diff that touches the line (#324).
# PLR0915: no function over 50 statements (#476): split by responsibility instead.
# PLR2004: no unnamed number in a comparison (#563): a threshold gets a name, and the
# name's comment says why that value. Tests are exempt: their numbers are the expected values.
# B: flake8-bugbear (#563), e.g. a zip() that must say whether unequal lengths are a bug.
# I: import order (#563), so an import diff shows what changed and not where it moved.
# SIM: simplifications (#563), less two of them that trade clarity for brevity: SIM300
# reads `F16_MAX > x` as a Yoda condition because the name is upper case, and SIM108
# folds a two-branch if into a ternary however long the line gets.
# C901: no function past cyclomatic complexity 10 (#563), the partner of PLR0915.
select = ["E4", "E7", "E9", "F", "W6", "W291", "W293", "RUF100", "PLR0915", "PLR2004", "B", "I", "SIM", "C901"]
ignore = ["SIM300", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pyright]
# Type-checks the package (#478). Basic mode: errors only, no strictness on the
# untyped jax/flax/optax surfaces. CI hands it the interpreter with --pythonpath; a
# plain `pyright` from the repo root uses whichever python is active.
include = ["trm"]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.vulture]
# Dead code: functions, classes, variables and attributes nothing references. Ruff
# sees one file at a time, so a `def` no other module calls passes it; this reads the
# whole tree at once. tests/ is scanned too, so a test-only helper is used, and an
# unused test helper is dead. It matches by name, so it errs toward keeping things.
paths = ["trm", "instruments", "experiments", "tests"]
min_confidence = 60
ignore_names = [
    # Declarations read through the AST by the tests/apparatus lints, never imported.
    "REPORTS", "ENV_DIVERGENCES", "CONFIG_DIVERGENCES",
    # Hooks pytest calls by name.
    "pytest_*",
    # The module-level mark variable pytest reads by name.
    "pytestmark",
    # What pydantic reads off a model class by name (trm/settings.py).
    "model_config", "settings_customise_sources",
    # Prose a spec may carry (instruments/spec_file.py): declared so a misspelled key
    # fails, read by people and never by code.
    "readouts_note", "recorded_note", "config_delta",
    # A session's end, recorded in run_metadata.json for people (trm/runtime/run_metadata.py).
    "end_time",
]
# Pydantic calls a validator through its decorator; nothing references it by name.
ignore_decorators = ["@field_validator"]
