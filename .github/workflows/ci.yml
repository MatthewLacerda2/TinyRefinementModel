name: CI

# MUTATION PROBE for #330 / #322 — never merged. Each matrix entry sets
# TRM_MUTATION, which the probe-only hooks in trm/ read, and runs the golden test
# plus the model invariants. "none" is the control: it must pass.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  probe:
    name: probe (${{ matrix.mutation }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mutation: [none, attn_double_scaled, causal_mask_dropped, target_off_by_one,
                   attn_resid_1e-2, attn_resid_1e-3, attn_resid_1e-4, attn_resid_1e-5,
                   one_ulp_block_out, pad_mask_dropped]
    env:
      JAX_PLATFORMS: cpu
      RUN_GOLDEN: "1"
      TRM_MUTATION: ${{ matrix.mutation }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.9.1"
          grep -v '^jax\[cuda12\]' requirements.txt | pip install -r /dev/stdin

      - name: Runner CPU
        run: grep -m1 "model name" /proc/cpuinfo

      - name: Golden + invariants under the mutation
        run: pytest tests/expensive/test_golden_run.py tests/core/test_model_invariants.py -rA
