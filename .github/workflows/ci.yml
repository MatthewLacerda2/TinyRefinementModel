name: CI

# MEASUREMENT PROBE for #325 — never merged. Prints the observed values behind two
# thresholds in tests/core/test_plan_a.py, and runs the rewritten config lints once.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  probe:
    name: probe (plan_a thresholds)
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.9.1"
          grep -v '^jax\[cuda12\]' requirements.txt | pip install -r /dev/stdin

      - name: Thresholds and config lints
        run: pytest tests/core/test_plan_a.py -k "init_loss_near_ln_vocab or overfit_single_batch" -s -rA tests/core/test_arch_guard.py tests/core/test_seed_config.py
