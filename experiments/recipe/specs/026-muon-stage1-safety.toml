# PRE-REGISTERED. Criteria committed before any run; git records the order.
#
# Stage 1 of #26: the CPU-scale SAFETY leg, not the claim. Muon's win is spectral
# conditioning of large matrices over many steps on web text; a dim-96 toy over
# 2500 steps is structurally underpowered to see a 1.3x token-efficiency effect,
# and a null here means nothing about that. What this can catch: it doesn't
# train, Newton-Schulz goes non-finite under our dtype policy, or a catastrophic
# regression from the partition. KEEP here means "safe to spend the card on
# stage 2", nothing more.
#
# Invokes the depth line's harness by COMMAND, not by import: the recipe line
# owns the question, the depth line owns the toy tasks. tests/core/
# test_package_layout.py forbids cross-line imports, not cross-line commands.

[experiment]
id = "026-stage1"
status = "recorded"
title = "Muon on the toy task: does the partitioned chain train, stay finite, and hold parity with AdamW?"
hypothesis = """
The partitioned Muon chain (scale_by_muon on 2-D kernels at lr x MUON_LR_MULT, AdamW
on the embedding, norms and biases) trains the vanilla toy stack on statetrack to
within noise of AdamW at every depth, with finite loss throughout.

Prediction registered: PARITY at every depth (within 2 sigma), no divergence. A
Muon WIN at this scale would be a surprise and would not be read as evidence for
stage 2's claim; a LOSS or a NaN would stop stage 2 until explained.
"""
issue = 26

[protocol]
floor_note = """
statetrack chance is 0.20 (vocab 5); every prior arm on this protocol scored
0.71-0.98 (spec 235), so parity between arms is a comparison between two models
that do the task. If either arm sits near 0.20 here, the parity criterion is void
and the leg is INCONCLUSIVE by hand regardless of the referee's reading.
"""
task = "statetrack"
metric_key = "acc"
metric = "held-out accuracy (chance 0.20)"
matched = "same seed => same init, same pools, same minibatch order; only --optimizer differs"
notes = """
Vanilla arch (distinct blocks, no loop) because that is the shape of the live
plain model; depths 1,2,4 = 1,2,4 distinct blocks. dim 96 / 2500 steps / seeds
0,1,2 as in specs 086 and 235, so the noise floor is one we already trust.
Harness lr 2e-3 for AdamW; Muon's matrix partition runs 2e-3 x MUON_LR_MULT (50
at the time of registration) = 0.1, in the range the reference recipes use for
small matrices. Not tuned here on purpose: tuning is stage 2's business.
"""

[execution]
command = ["python", "-m", "experiments.depth.ablation_harness",
           "--task", "statetrack", "--arch", "vanilla", "--dim", "96", "--steps", "2500",
           "--depths", "1,2,4"]
seeds = [0, 1, 2]
seed_flag = "--seed"

[arms.adamw]
role = "control"
flags = ["--optimizer", "adamw"]

[arms.muon]
role = "treatment"
flags = ["--optimizer", "muon"]

[criteria.parity_at_every_depth]
rule = "within"
treatment = "muon"
control = "adamw"
sigmas = 2.0
points = ["d1", "d2", "d4"]
require = "all"

[criteria.loses_at_a_depth]
rule = "loses"
treatment = "muon"
control = "adamw"
sigmas = 2.0
points = ["d1", "d2", "d4"]
require = "any"

[verdict]
keep_if = ["parity_at_every_depth"]
kill_if = ["loses_at_a_depth"]
recorded = "INCONCLUSIVE"
recorded_note = """
2026-09-14. No kill criterion fired: every run trained, every loss stayed finite, no
depth lost 2 sigma. The keep bar was NOT met, and on the side the drafter did not
anticipate: at d1 Muon is +2.85 sigma AHEAD (0.831/0.831/0.857 vs 0.815/0.804/0.801),
which breaks a parity criterion just as a loss would. d2 -0.70 sigma, d4 -1.60 sigma.
The registered prediction (parity everywhere) was wrong at d1.

Read for what the leg is for: the chain is safe to spend the card on. The d4 lean
(-1.6 sigma, untuned multiplier) is exactly the thing stage 2's sweep sets, and a
parity keep-bar that a WIN can break was a drafting mistake, recorded here rather
than re-drafted after the fact.
"""

[readouts]
notes = "wall-clock per run (Newton-Schulz adds 5 small matmuls per kernel); carries no weight."

