# PRE-REGISTERED. Criteria committed before any run of this spec; git records the order.

[experiment]
id = "359-adam-b2"
status = "open"
title = "Adam beta2 0.95 vs 0.999 on the parameters Muon does not own"
hypothesis = """
Adam's second moment remembers ~1/(1-b2) opt steps: ~1000 at 0.999 (the optax default
we trained with unnamed until #358), ~20 at 0.95 (GPT-3, LLaMA, PaLM, nanoGPT). Our
micro-step gradient norms are heavy-tailed (#201), and at 0.999 one spike holds down the
effective LR of every parameter it touched for ~3% of a base run.

Under the shipped recipe Muon owns the 2-D block matrices; Adam still owns the embedding
(tied to the LM head, 48M of 148M params), the norms and the biases (muon_partition in
trm/train/optimizers.py). So this pair asks the question on the part of the model Adam
still trains: does b2 0.95 reach held-out CE 5.85 in fewer tokens?

Prediction registered (#359's, kept): small KEEP, 5-15% fewer tokens, with real weight
on INCONCLUSIVE at 512 steps. The arms share the same spikes, and the damage 0.999 does
is per spike, so it should show more on a long run than a short one. Since #359 was
written, Muon took the matrices, which shrinks the share of the model this knob touches:
I lean INCONCLUSIVE. My recent predictions on this line ran too timid (#382, #287), so if
this is wrong I expect a larger effect, not a KILL.
"""
issue = 359

[protocol]
floor_note = """
Tokens to a target, capped at the run (67.1M): an arm that never reaches 5.85 reports
the cap, and two capped arms tie as INCONCLUSIVE. The floor is the seeds' own spread
(#382's Muon arms: tokens to 5.85 within one probe interval, 8 opt steps = 1.05M).
"""
cap = 67.108864
metric_key = "tokens_to_target_M"
metric = "millions of tokens to the first validation probe at or below held-out CE 5.85 (lower is better)"
matched = "same seed => same init and same data order (MODEL_SEED = DATA_SEED = seed), same commit, same recipe; only ADAM_B2 differs"
notes = """
Recipe: plain, 9 x 960, Muon x16.667 on a 6e-4 schedule, warmup 100, the mixture ramp
budget-relative (#362), val every 8 on 64 rows, val_step-aligned (#351). The pad is
pinned at 50256 in both arms so #373's outcome cannot leak into this pair. Both arms are
new runs.
min_delta = 0.85M tokens is 5% of the ~17M the recipe needed in #382: the low end of
the registered prediction.
"""

[execution]
command = ["python", "-m", "experiments.recipe.tokens_to_ce",
           "--target-ce", "5.85", "--opt-steps", "512", "--val-every", "8",
           "--optimizer", "muon", "--lr-mult", "16.666667", "--peak-lr", "6e-4",
           "--pad-token-id", "50256", "--tag", "359"]
seeds = [0, 1, 2]
seed_flag = "--seed"
env = { EVAL_ROWS = "64", PLAIN_LAYERS = "9" }

[arms.b2_999]
role = "control"
flags = ["--set", "ADAM_B2=0.999"]

[arms.b2_95]
role = "treatment"
flags = ["--set", "ADAM_B2=0.95"]

# Tokens: LOWER is better, so a win for 0.95 is the CONTROL's number being larger.
[criteria.b2_95_needs_fewer_tokens]
rule = "beats"
treatment = "b2_999"
control = "b2_95"
sigmas = 2.0
min_delta = 0.85
points = ["run"]
require = "all"

[criteria.b2_95_needs_more_tokens]
rule = "loses"
treatment = "b2_999"
control = "b2_95"
sigmas = 2.0
min_delta = 0.85
points = ["run"]
require = "all"

[verdict]
keep_if = ["b2_95_needs_fewer_tokens"]
kill_if = ["b2_95_needs_more_tokens"]

[readouts]
notes = """
What each verdict means, written before the numbers: KEEP -> ADAM_B2 defaults to 0.95
in the PR that records it. INCONCLUSIVE -> keep 0.999 (no evidence to move a default
that every run on record used), and note the pair on #359. KILL -> keep 0.999, one
graveyard line.
Readouts, no weight: final_val_ce at the cap; clip rate; the per-source gradient norms
(#364); the loss-scale column (a spike that the faster b2 forgets sooner should show as
a shorter dip in the applied norm).
"""
