# PRE-REGISTERED, approved by the owner on 2026-11-06; launch planned 2026-11-07.
# One arm judged against the constant GPT-2-small yardstick, like 001. The recipe is
# today's Config defaults: 001's shape and optimizer, plus five settled adoptions that
# landed after 001 launched (listed in the hypothesis), on the new data.
#
# From the root checkout (its .env points DATA_ROOT at runs/data-dedup):
# `make launch SPEC=experiments/base/specs/002-smol-mix-base.toml BUDGET=7.5e9`

[experiment]
id = "002-smol-mix-base"
status = "open"
title = "Does the plain recipe on the SmolLM mix, trained for 10 days, reach GPT-2-small on LAMBADA?"
hypothesis = """
Today's recipe — 001's PlainTransformer at dim 960, 8 layers at batch 2, f16 compute,
tied embeddings, r50k with EOT a trained token, Muon x16.667 on a 6e-4 WSD schedule,
plus the five adoptions below — trained on the SmolLM team's constant mix (#597: FineWeb-Edu-Dedup 70 / Stack-Edu
Python 20 / FineMath 3+ 10, deduplicated, `runs/data-dedup`) to `budget_tokens`
reaches GPT-2-small's LAMBADA last-word accuracy (0.3256).

001 scored 0.2036 at 5.0B tokens on a mix that ended at 35% prose, KILL by its own
margin. What moves this run's number, all settled outside this repo or by pairs here:
- the data: prose share 35% -> 70% for the whole run (#363's three readings: the web
  probe sat flat while code and math took 65% of the tokens); a deduplicated web bucket,
  96.6% unique against 12.4% (#591); Stack-Edu and FineMath 3+ for codeparrot and
  FineMath 4+ (#597);
- 1.5x the tokens, 7.5B against 5.0B (the code got faster, before #474 001 ran 17.4 s
  per opt step);
- five recipe adoptions that landed after 001 launched, each a default now: Adam b2
  0.999 -> 0.95 (#359), z-loss 1e-4 (#369), an f32 residual stream (#357), embedding
  weight decay at the nanoGPT/GPT-3 rate (#360), and Polar Express coefficients for
  Muon's Newton-Schulz steps (#375). And one precision fix, added 2026-11-06 with the
  owner's approval: every norm that reads the f32 residual stream reads it in f32
  (PR #617), so the stream's width now reaches the norms #357 meant it to.
Two differently-built runs: a 001 -> 002 difference is the sum of all of these, and
names none of them as its cause.

Prediction, registered before launch: **0.26** (honest range 0.22–0.31), so a
KILL-band reading again, short of the gate. Reasoning: LAMBADA is narrative prose,
and FineWeb-Edu is educational prose, not fiction; SmolLM2-135M reaches 0.4289 on
this mix only at ~2T tokens, 270x this budget. Prediction record on this line: 001's
two predictions were 0.29 and 0.33 and it scored 0.2036, so this line has been too
optimistic, and 0.26 is written knowing that.
"""
issue = 597

[protocol]
floor_note = """
As in 001: the reference arm is a constant, calibrated GPT-2-small (124M) measured by
this repo's yardstick (calibrate_gpt2, exact match to lm-eval-harness lambada_openai).
Chance on LAMBADA last-word is ~0, so a run at chance reads as a KILL, never parity.
The reference has sigma 0 and the run is one seed: the criteria are absolute margins,
not sigma bars.
"""
metric_key = "lambada_acc"
metric = "LAMBADA last-word accuracy on the full 5,153-example set (instruments.yardstick.eval_yardstick), at completion"
matched = "n/a — a single arm against a published reference; observational, not causal"
notes = """
THE BUDGET is a time budget in disguise: the owner's ceiling is 10 days of
uninterrupted training (2026-10-16). 7.5B tokens is 57,221 opt steps of 131,072
tokens, and the launcher stops at the checkpoint boundary at or past it: opt step
57,280 (7.508B tokens). Measured in this spec's dress rehearsal (2026-11-06, 645 opt
steps on this corpus and mix, through the supervisor, with val probes, checkpoints,
milestones and one crash-resume): a mean of 14.7-14.8 s per opt step over the run
(probes and checkpoints included; median 14.2), so 9.75-9.81 days, 9.77-9.83 with the
~30 minutes of launch gates and final scoring. 001 measured 17.4 s on older code
(before #474), and the real trainer's 24-step reading was 13.9 s with no probes (#433).
7.5B fits 10 days below a mean of 15.05 s per opt step; slower than that, the run is
stopped early by the owner's ceiling, not by this spec.

The corpus holds 10.5B tokens (fineweb-edu 7.2B, stack-edu 2.2B, finemath 1.1B), so
at 70/20/10 a 7.5B run reads 5.25B / 1.5B / 0.75B, clear of every validation tail
(#596).

HOW IT STOPS: at the budget, or earlier under the stall rule. 001's "or earlier if
held-out CE passes 3.6" is dropped: it was measured on the old fineweb slice and
corpus (#596, #597), and there is no reading of this probe yet to set a new one.

THE STALL RULE is 001's, unchanged: read the fineweb-edu probe every 12 hours; two
consecutive windows that each gain less than 0.01 start a 1,000-opt-step decay. Its
bar was set from the 4B refiner champion's curve (001's notes). Measured on 001's own
curve before its decay (`instruments.stall --floor --until-step 30528`): reading
noise 0.009, 12-hour gain median 0.0275 in the first third and 0.0124 in the last, so
001 never stalled by it and ran to its budget. This run's probe reads a new corpus's
tail, so the bar cannot be re-measured until this run has a curve; 0.01 is kept, not
re-derived. The mix is constant, so the rule reads from the first row.

Waived for this run by the owner, by name, on 2026-11-06 (each issue has the reason):
#363 (the chosen mix is the prose-led treatment it proposed), #366 (the run fits
without the 185 MiB), #434 (DCLM and Cosmopedia wait until after this run), #494
(POST_NORM stays off, as in 001).
"""
budget_tokens = 7500000000
arch = "plain"
layers = 8
batch_size = 2
accumulation_steps = 64
optimizer = "muon"
muon_lr_mult = 16.666667
peak_lr = 6e-4
lr_schedule = "wsd"
wsd_decay_fraction = 0.2
warmup_steps = 1000
pad_token_id = 50257
data_mixture = "pretrain/fineweb-edu=0.70,pretrain/stack-edu=0.20,pretrain/finemath=0.10"
data_root = "runs/data-dedup"
seeds = "MODEL_SEED=42, DATA_SEED=42"
milestone_yardstick_limit = 1000

[stall]
reads = "web"
window_hours = 12
windows = 2
min_gain = 0.01
decay_opt_steps = 1000

[arms.plain]
role = "treatment"
flags = []

[arms.gpt2_small]
role = "floor"
constant = true

# The reference: acc 0.3256 / ppl 40.06. Declared as a summary with sigma 0, n 1.
[results.run]
gpt2_small = { mean = 0.3256, sigma = 0.0, n = 1 }

# KEEP: at or above the reference.
[criteria.meets_the_bar]
rule = "beats"
treatment = "plain"
control = "gpt2_small"
sigmas = 0.0
points = ["run"]
require = "all"

# KILL: more than 0.05 accuracy below it — the "fix the pipeline first" branch.
[criteria.misses_by_a_margin]
rule = "loses"
treatment = "plain"
control = "gpt2_small"
sigmas = 0.0
min_delta = 0.05
points = ["run"]
require = "all"

[verdict]
keep_if = ["meets_the_bar"]
kill_if = ["misses_by_a_margin"]

[readouts]
notes = """
LAMBADA ppl beside the reference's 40.06; held-out CE per source (fineweb-edu,
stack-edu, finemath tails); the milestone subsample trajectory in
runs/<run>/yardstick.jsonl; peak VRAM and wall-clock s/opt step for the card; and
001's 0.2036 at 5.0B beside this run's milestone at the same token count, a ballpark
(two differently-built runs, CLAUDE.md), never a cause. No weight.
"""
